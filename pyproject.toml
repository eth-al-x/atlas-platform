[project]
name = "atlas"
version = "2.0.0"
description = "ATLAS — A multi-layered defensive security analysis platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ethan Long" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1"]
arp = ["scapy>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.4", "respx>=0.21"]
all = ["atlas[api,arp,dev]"]

[project.scripts]
atlas = "atlas.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
