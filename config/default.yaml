# ATLAS default configuration
# Override values via environment variables (prefixed ATLAS_) or CLI flags

analysis:
  # Tier execution: stop analysis after a high-confidence flag
  early_exit_on_high_risk: true

  # Shannon entropy threshold for DGA detection (standard baseline: 3.8)
  entropy_threshold: 3.8

  # Domain age in hours below which a domain is flagged as suspicious
  age_threshold_hours: 48

  # VirusTotal danger score percentage at which a URL becomes "High Risk"
  virustotal_danger_threshold: 10.0

  # Maximum retries for rate-limited API calls
  max_retries: 3
  retry_wait_seconds: 60

  # Request timeout in seconds
  request_timeout: 10

blocklist:
  # StevenBlack hosts file URL
  source_url: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
  cache_filename: "malicious_host_cache.txt"
  # Re-download the cache if older than this many hours
  max_cache_age_hours: 24

dnsbl:
  mirrors:
    - "dbl.spamhaus.org"
    - "multi.surbl.org"
  timeout_seconds: 3.0

storage:
  database_path: "atlas.db"

server:
  host: "0.0.0.0"
  port: 8000

greynoise:
  # GreyNoise Community API endpoint
  # Override with Enterprise URL if you have an Enterprise key
  community_url: "https://api.greynoise.io/v3/community/{ip}"
  # Timeout per request in seconds
  timeout_seconds: 10
  # API key: set GREYNOISE_API_KEY in .env
  # Without a key: 100 req/day (unauthenticated Community tier)
  # With a free key: 10,000 req/day

censys:
  # Censys v2 Certificate Search API
  search_url: "https://search.censys.io/api/v2/certificates/search"
  timeout_seconds: 15
  # Certificates returned per page (Censys max: 100)
  per_page: 100
  # Max pages to fetch per domain — each page costs 1 API query.
  # Free tier: 250 queries/month. 5 pages × 100 results = up to 500 certs.
  max_pages: 5
  # Credentials: set CENSYS_API_ID and CENSYS_API_SECRET in .env

jarm:
  # JARM TLS fingerprinting target port.
  # 443 is HTTPS; could be set to 465 (SMTPS), 993 (IMAPS), etc.
  port: 443
  # Per-handshake timeout in seconds. Total scan time worst case is
  # roughly this × 5 because the 10 handshakes run with concurrency=2.
  timeout_seconds: 10